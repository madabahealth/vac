<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل فحص موظف جديد</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #0f172a;
      --bg-light: #f8fafc;
      --surface: #ffffff;
      --text-main: #1e293b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-main); padding: 1.5rem; }

    .card {
      max-width: 900px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--secondary);
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      border-bottom: 2px solid var(--bg-light);
      padding-bottom: 1rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group label { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }
    .form-group input, .form-group select {
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }
    .form-group input:focus, .form-group select:focus { border-color: var(--primary); }

    .btn-submit {
      grid-column: 1 / -1;
      background: var(--primary);
      color: white;
      border: none;
      padding: 1rem;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: var(--primary-dark); }

    #toast {
      position: fixed; bottom: 20px; left: 20px;
      padding: 1rem 1.5rem; border-radius: 8px; background: var(--secondary); color: white;
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); display: none; z-index: 1000; font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2 class="card-title"><i class="fa-solid fa-user-plus" style="color: var(--primary);"></i> تسجيل بيانات فحص موظف جديد</h2>
    <form id="healthForm" onsubmit="handleFormSubmit(event)">
      <div class="form-grid">
        <div class="form-group">
          <label>اسم الموظف</label>
          <input type="text" id="employeeName" required placeholder="مثال: أحمد محمد علي">
        </div>
        <div class="form-group">
          <label>الرقم الوطني</label>
          <input type="text" id="nationalId" required pattern="[0-9]{10}" title="10 أرقام" placeholder="10 أرقام">
        </div>
        <div class="form-group">
          <label>المسمى الوظيفي</label>
          <input type="text" id="jobTitle" required placeholder="مثال: ممرض / طبيب">
        </div>
        <div class="form-group">
          <label>اسم المركز</label>
          <input type="text" id="centerName" required placeholder="اسم المركز الصحي / المستشفى">
        </div>
        <div class="form-group">
          <label>القسم</label>
          <input type="text" id="department" required placeholder="مثال: الطوارئ / المختبر">
        </div>
        <div class="form-group">
          <label>تاريخ الفحص</label>
          <input type="date" id="testDate" required>
        </div>
        <div class="form-group">
          <label>نتيجة Titer (وحدة دولية)</label>
          <input type="number" step="0.1" id="titerResult" required placeholder="مثال: 12.5" oninput="autoCheckVaccine()">
        </div>
        <div class="form-group">
          <label>يحتاج مطعوم Vaccine؟</label>
          <select id="needsVaccine" required>
            <option value="لا">لا</option>
            <option value="نعم">نعم</option>
          </select>
        </div>
        <div class="form-group">
          <label>موعد إعادة الفحص</label>
          <input type="date" id="retestDate" required>
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">
          <i class="fa-solid fa-paper-plane"></i> حفظ وإرسال البيانات
        </button>
      </div>
    </form>
  </div>

  <div id="toast"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1mF-j0oz4XzGUPQ12qOCi253UISVTvXUV3sqnS5-2uTSOsVeISVNlITfYTkblpRr49A/exec";

    function autoCheckVaccine() {
      const titerVal = parseFloat(document.getElementById('titerResult').value);
      const vaccineSelect = document.getElementById('needsVaccine');
      if (!isNaN(titerVal)) {
        vaccineSelect.value = titerVal < 15 ? "نعم" : "لا";
      }
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> جاري الحفظ...`;

      const newRecord = {
        employeeName: document.getElementById('employeeName').value,
        nationalId: document.getElementById('nationalId').value,
        jobTitle: document.getElementById('jobTitle').value,
        centerName: document.getElementById('centerName').value,
        department: document.getElementById('department').value,
        testDate: document.getElementById('testDate').value,
        titerResult: parseFloat(document.getElementById('titerResult').value),
        needsVaccine: document.getElementById('needsVaccine').value,
        retestDate: document.getElementById('retestDate').value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "ADD_RECORD", data: newRecord })
      })
      .then(res => res.json())
      .then(res => {
        if (res.status === "success") {
          showToast("تم حفظ البيانات بنجاح!", "success");
          document.getElementById('healthForm').reset();
        } else {
          showToast("حدث خطأ أثناء الحفظ", "error");
        }
      })
      .catch(err => {
        showToast("تم إرسال الطلب بنجاح", "success");
        document.getElementById('healthForm').reset();
      })
      .finally(() => {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> حفظ وإرسال البيانات`;
      });
    }

    function showToast(msg, type) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.style.background = type === 'error' ? '#ef4444' : '#10b981';
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 3000);
    }
  </script>
</body>
</html>
