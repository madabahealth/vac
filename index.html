
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المدير - متابعة الفحوصات الطبية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #0f172a;
      --bg-light: #f8fafc;
      --surface: #ffffff;
      --text-main: #1e293b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);

      /* ألوان الحالات المطلوب تحديدها */
      --color-green: #10b981;
      --color-red: #ef4444;
      --color-yellow: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-main); padding: 1.5rem; }

    .container { max-width: 1200px; margin: 0 auto; }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header h1 { font-size: 1.6rem; color: var(--secondary); font-weight: 800; }

    .btn-refresh {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: opacity 0.2s;
    }
    .btn-refresh:hover { opacity: 0.9; }

    /* كروت الداشبورد الإحصائية */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.2rem;
      margin-bottom: 2rem;
    }

    .kpi-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.25rem;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .kpi-info h3 { font-size: 0.85rem; color: #64748b; margin-bottom: 0.4rem; }
    .kpi-info .value { font-size: 1.8rem; font-weight: 800; }
    .kpi-icon {
      font-size: 2rem;
      width: 50px;
      height: 50px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* تخصيص الألوان المطلوبة للداشبورد */
    .card-green { border-right: 5px solid var(--color-green); }
    .card-green .value { color: var(--color-green); }
    .card-green .kpi-icon { background: #dcfce7; color: var(--color-green); }

    .card-red { border-right: 5px solid var(--color-red); }
    .card-red .value { color: var(--color-red); }
    .card-red .kpi-icon { background: #fee2e2; color: var(--color-red); }

    .card-yellow { border-right: 5px solid var(--color-yellow); }
    .card-yellow .value { color: var(--color-yellow); }
    .card-yellow .kpi-icon { background: #fef3c7; color: var(--color-yellow); }

    .card-blue { border-right: 5px solid var(--primary); }
    .card-blue .value { color: var(--primary); }
    .card-blue .kpi-icon { background: #dbeafe; color: var(--primary); }

    /* جدول البيانات */
    .table-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 1.5rem;
      overflow: hidden;
    }

    .table-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      position: relative;
      min-width: 280px;
    }
    .search-box input {
      width: 100%;
      padding: 0.6rem 2.2rem 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
    }
    .search-box i {
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: #94a3b8;
    }

    .table-responsive {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    th {
      background: #f1f5f9;
      padding: 0.85rem;
      font-size: 0.85rem;
      color: var(--secondary);
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 0.85rem;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tr:hover { background-color: #f8fafc; }

    /* أوسمة التنبيهات والتحذيرات داخل الجدول */
    .badge {
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .badge-red { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
    .badge-green { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
    .badge-yellow { background: #fef3c7; color: #d97706; border: 1px solid #fde047; }

    .warning-pulse {
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }

    #loading {
      text-align: center;
      padding: 2rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1><i class="fa-solid fa-chart-line" style="color: var(--primary);"></i> لوحة تحكم المدير - متابعة الفحوصات</h1>
      <button class="btn-refresh" onclick="loadData()">
        <i class="fa-solid fa-rotate-right" id="refreshIcon"></i> تحديث البيانات
      </button>
    </div>

    <!-- بطاقات الداشبورد -->
    <div class="kpi-grid">
      <div class="kpi-card card-green">
        <div class="kpi-info">
          <h3>المحصنين</h3>
          <div class="value" id="countVaccinated">0</div>
        </div>
        <div class="kpi-icon"><i class="fa-solid fa-user-shield"></i></div>
      </div>

      <div class="kpi-card card-red">
        <div class="kpi-info">
          <h3>غير محصن (يحتاج لقاح)</h3>
          <div class="value" id="countNeedVaccine">0</div>
        </div>
        <div class="kpi-icon"><i class="fa-solid fa-syringe"></i></div>
      </div>

      <div class="kpi-card card-yellow">
        <div class="kpi-info">
          <h3>بانتظار (إعادة فحص/لقاح)</h3>
          <div class="value" id="countPending">0</div>
        </div>
        <div class="kpi-icon"><i class="fa-solid fa-clock-rotate-left"></i></div>
      </div>

      <div class="kpi-card card-blue">
        <div class="kpi-info">
          <h3>نسبة التغطية</h3>
          <div class="value" id="coverageRate">0%</div>
        </div>
        <div class="kpi-icon"><i class="fa-solid fa-percent"></i></div>
      </div>
    </div>

    <!-- جدول البيانات -->
    <div class="table-card">
      <div class="table-header">
        <h2>سجل فحوصات الموظفين</h2>
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="بحث باسم الموظف، الرقم الوطني، المركز...">
        </div>
      </div>

      <div class="table-responsive">
        <table id="recordsTable">
          <thead>
            <tr>
              <th>#</th>
              <th>اسم الموظف</th>
              <th>الرقم الوطني</th>
              <th>المركز / القسم</th>
              <th>تاريخ الفحص</th>
              <th>نتيجة Titer</th>
              <th>حالة التطعيم</th>
              <th>موعد إعادة الفحص</th>
              <th>التنبيهات</th>
            </tr>
          </thead>
          <tbody id="tableBody">
            <!-- سيتم إضافة البيانات هنا عبر JavaScript -->
          </tbody>
        </table>
        <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل البيانات...</div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1mF-j0oz4XzGUPQ12qOCi253UISVTvXUV3sqnS5-2uTSOsVeISVNlITfYTkblpRr49A/exec";
    let allRecords = [];

    // تحميل البيانات عند فتح الصفحة
    window.onload = loadData;

    function loadData() {
      const refreshIcon = document.getElementById('refreshIcon');
      refreshIcon.classList.add('fa-spin');
      document.getElementById('loading').style.display = 'block';

      fetch(SCRIPT_URL + "?action=GET_RECORDS")
        .then(res => res.json())
        .then(data => {
          allRecords = data;
          renderDashboard(data);
          renderTable(data);
        })
        .catch(err => {
          console.error("خطأ في جلب البيانات:", err);
          document.getElementById('loading').innerText = "حدث خطأ أثناء تحميل البيانات من الخادم.";
        })
        .finally(() => {
          refreshIcon.classList.remove('fa-spin');
        });
    }

    function renderDashboard(data) {
      let vaccinated = 0;
      let needVaccine = 0;
      let pending = 0;
      const today = new Date();

      data.forEach(item => {
        const titer = parseFloat(item.titerResult);
        const retestDate = new Date(item.retestDate);

        if (titer >= 15) {
          vaccinated++;
        } else if (item.needsVaccine === "نعم") {
          needVaccine++;
        }

        // حساب حالة بانتظار (إذا كان موعد القاح/إعادة الفحص في المستقبل أو لم يُنجز)
        if (retestDate >= today || item.status === "بانتظار") {
          pending++;
        }
      });

      const total = data.length;
      const rate = total > 0 ? ((vaccinated / total) * 100).toFixed(1) : 0;

      document.getElementById('countVaccinated').innerText = vaccinated;
      document.getElementById('countNeedVaccine').innerText = needVaccine;
      document.getElementById('countPending').innerText = pending;
      document.getElementById('coverageRate').innerText = rate + "%";
    }

    function renderTable(data) {
      const tbody = document.getElementById('tableBody');
      const loading = document.getElementById('loading');
      tbody.innerHTML = "";

      if (data.length === 0) {
        loading.innerText = "لا توجد بيانات مسجلة حتى الآن.";
        return;
      }
      loading.style.display = 'none';

      const today = new Date();

      data.forEach((item, index) => {
        const tr = document.createElement('tr');
        const titer = parseFloat(item.titerResult);
        const retestDate = new Date(item.retestDate);
        
        // حساب فرق الأيام بين اليوم وموعد الفحص
        const diffDays = Math.ceil((retestDate - today) / (1000 * 60 * 60 * 24));

        // 1. تحذير نتيجة Titer (أقل من 15)
        let titerBadge = titer < 15 
          ? `<span class="badge badge-red warning-pulse"><i class="fa-solid fa-triangle-exclamation"></i> ${titer} (منخفض)</span>`
          : `<span class="badge badge-green"><i class="fa-solid fa-circle-check"></i> ${titer}</span>`;

        // 2. حالة اللقاح (أحمر، أخضر، أصفر)
        let vaccineStatus = "";
        if (titer >= 15) {
          vaccineStatus = `<span class="badge badge-green"><i class="fa-solid fa-shield"></i> محصن</span>`;
        } else if (item.needsVaccine === "نعم") {
          vaccineStatus = `<span class="badge badge-red"><i class="fa-solid fa-syringe"></i> غير محصن (يحتاج لقاح)</span>`;
        } else {
          vaccineStatus = `<span class="badge badge-yellow"><i class="fa-solid fa-hourglass-half"></i> بانتظار المطعوم</span>`;
        }

        // 3. تنبيهات مواعيد إعادة الفحص والمطعوم
        let alertBadge = "";
        if (diffDays < 0) {
          alertBadge = `<span class="badge badge-red"><i class="fa-solid fa-circle-exclamation"></i> تجاوز موعد الفحص</span>`;
        } else if (diffDays <= 7) {
          alertBadge = `<span class="badge badge-yellow"><i class="fa-solid fa-bell"></i> موعده قريب (${diffDays} يوم)</span>`;
        } else {
          alertBadge = `<span style="color:#94a3b8; font-size: 0.8rem;">مجدول بنجاح</span>`;
        }

        tr.innerHTML = `
          <td>${index + 1}</td>
          <td><strong>${item.employeeName}</strong></td>
          <td>${item.nationalId}</td>
          <td>${item.centerName} / ${item.department}</td>
          <td>${item.testDate}</td>
          <td>${titerBadge}</td>
          <td>${vaccineStatus}</td>
          <td>${item.retestDate}</td>
          <td>${alertBadge}</td>
        `;

        tbody.appendChild(tr);
      });
    }

    function filterTable() {
      const input = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allRecords.filter(item => {
        return item.employeeName.toLowerCase().includes(input) ||
               item.nationalId.includes(input) ||
               item.centerName.toLowerCase().includes(input) ||
               item.department.toLowerCase().includes(input);
      });
      renderTable(filtered);
    }
  </script>
</body>
</html>
