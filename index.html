<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مغامرات اللغة الإنجليزية - لؤلؤة مادبا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f0f4ff 0%, #e0e7ff 100%);
            min-height: 100vh;
        }
        .en-font { font-family: 'Poppins', sans-serif; }
        .card {
            background: white;
            border-radius: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .animate-pop { animation: pop 0.3s ease-out; }
        @keyframes pop {
            0% { transform: scale(0.9); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .hidden { display: none; }
        .btn-primary {
            background-color: #4f46e5;
            color: white;
            transition: all 0.2s;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #4338ca;
            transform: translateY(-2px);
        }
        .btn-primary:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .logo-display {
            width: 120px;
            height: auto;
            margin-bottom: 1rem;
        }
        #image-preview {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #4f46e5;
            margin: 10px auto;
        }
        #player-pic-small {
            object-fit: cover;
        }
    </style>
</head>
<body class="p-4 flex justify-center items-start">

    <main class="w-full max-w-2xl">
        
        <!-- Welcome Screen -->
        <section id="welcome-screen" class="card p-8 text-center space-y-6 animate-pop">
            <div class="flex flex-col items-center">
                <!-- الشعار المستهدف -->
                <img src="logo.png" alt="شعار المدرسة" class="logo-display" onerror="this.src='https://via.placeholder.com/120x120?text=Logo'">
                
                <h3 class="text-xl font-bold text-indigo-800">مدرسة وروضة لؤلؤة مادبا النموذجية</h3>
                <p class="text-indigo-600 font-bold text-lg mt-2 italic">عمل الطالبة: ملك باسم سلامه</p>
            </div>

            <h1 class="text-3xl font-bold text-gray-800">أهلاً أيها البطل! 🚀</h1>
            <p class="text-gray-600">أتقن الضمائر و "Verb to Be" في هذه المغامرة الممتعة!</p>
            
            <div class="space-y-4 text-right">
                <div class="flex flex-col gap-2">
                    <label class="font-bold text-gray-700">ما هو اسمك؟</label>
                    <input type="text" id="child-name" placeholder="اكتب اسمك هنا" class="p-3 border-2 border-gray-200 rounded-xl focus:border-indigo-400 outline-none transition-all">
                </div>

                <div class="flex flex-col gap-2">
                    <label class="font-bold text-gray-700">صورتك الرائعة (اختياري)</label>
                    <input type="file" id="child-picture" accept="image/*" class="text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                    <img id="image-preview" src="https://via.placeholder.com/100?text=Avatar" alt="معاينة الصورة">
                </div>
            </div>

            <button id="start-btn" onclick="startGame()" class="btn-primary w-full py-4 rounded-2xl text-xl font-bold shadow-lg">
                ابدأ المغامرة الآن
            </button>
        </section>

        <!-- Game Screen -->
        <section id="game-screen" class="hidden space-y-6 animate-pop">
            <div class="card p-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <img id="player-pic-small" src="" class="w-12 h-12 rounded-full border-2 border-indigo-500 hidden">
                    <div>
                        <p id="player-display-name" class="font-bold text-gray-800"></p>
                        <div class="text-yellow-500 font-bold flex items-center gap-1">
                            <i class="fas fa-star"></i> <span id="score">0</span>
                        </div>
                    </div>
                </div>
                <div class="text-indigo-600 font-bold en-font" id="timer">00:00</div>
            </div>

            <div class="w-full bg-gray-200 h-3 rounded-full overflow-hidden shadow-inner">
                <div id="progress-bar" class="bg-indigo-500 h-full w-0 transition-all duration-500"></div>
            </div>

            <div class="card p-8 min-h-[300px] flex flex-col items-center justify-center text-center relative overflow-hidden border-4 border-transparent transition-all" id="question-box">
                <!-- Question injected here -->
            </div>

            <div id="options-grid" class="grid grid-cols-2 gap-4">
                <!-- Options injected here -->
            </div>
        </section>

        <!-- Final Results Screen -->
        <section id="results-screen" class="hidden card p-8 text-center space-y-6 animate-pop">
            <div class="flex flex-col items-center">
                <img src="logo.png" alt="شعار المدرسة" class="logo-display mx-auto" onerror="this.style.display='none'">
                <div class="text-7xl mt-2">🏆</div>
            </div>
            <h2 class="text-3xl font-bold text-indigo-700">أحسنت يا بطل!</h2>
            <img id="player-pic-final" src="" class="w-24 h-24 rounded-full border-4 border-indigo-500 mx-auto hidden">
            <div class="bg-indigo-50 p-6 rounded-2xl">
                <p id="final-stats" class="text-xl text-gray-700"></p>
                <p id="accuracy-text" class="text-sm font-bold text-indigo-500 mt-2"></p>
            </div>
            <button onclick="location.reload()" class="btn-primary w-full py-4 rounded-2xl font-bold text-lg">
                العب مرة أخرى
            </button>
        </section>

    </main>

    <script>
        // بنك أسئلة متنوع وشامل
        const questionBank = [
            // Verb to Be - Affirmative
            { q: 'I ____ a student.', options: ['am', 'is', 'are', 'be'], correct: 'am', hint: 'أنا طالب' },
            { q: 'He ____ my dad.', options: ['am', 'is', 'are', 'be'], correct: 'is', hint: 'هو والدي' },
            { q: 'She ____ a teacher.', options: ['am', 'is', 'are', 'be'], correct: 'is', hint: 'هي معلمة' },
            { q: 'It ____ a cat.', options: ['am', 'is', 'are', 'been'], correct: 'is', hint: 'إنها قطة' },
            { q: 'We ____ hungry.', options: ['am', 'is', 'are', 'was'], correct: 'are', hint: 'نحن جائعون' },
            { q: 'You ____ a hero.', options: ['am', 'is', 'are', 'was'], correct: 'are', hint: 'أنت بطل' },
            { q: 'They ____ playing.', options: ['am', 'is', 'are', 'be'], correct: 'are', hint: 'هم يلعبون' },
            { q: 'The sun ____ hot.', options: ['am', 'is', 'are', 'be'], correct: 'is', hint: 'الشمس حارة' },
            { q: 'My friends ____ kind.', options: ['am', 'is', 'are', 'be'], correct: 'are', hint: 'أصدقائي طيبون' },
            { q: 'The apple ____ red.', options: ['am', 'is', 'are', 'be'], correct: 'is', hint: 'التفاحة حمراء' },
            
            // Pronouns
            { q: '____ am from Jordan.', options: ['I', 'He', 'She', 'They'], correct: 'I', hint: 'أنا من الأردن' },
            { q: '____ is a doctor.', options: ['I', 'He', 'They', 'We'], correct: 'He', hint: 'هو طبيب' },
            { q: '____ is a girl.', options: ['She', 'I', 'You', 'They'], correct: 'She', hint: 'هي بنت' },
            { q: '____ are brothers.', options: ['He', 'It', 'We', 'I'], correct: 'We', hint: 'نحن إخوة' },
            { q: '____ are big.', options: ['They', 'He', 'She', 'It'], correct: 'They', hint: 'هم كبار' },
            { q: '____ is a pencil.', options: ['It', 'I', 'You', 'We'], correct: 'It', hint: 'إنه قلم رصاص' },
            
            // Verb to Be - Negative
            { q: 'I am ____ sad.', options: ['is', 'no', 'not', 'are'], correct: 'not', hint: 'أنا لست حزيناً' },
            { q: 'It is ____ cold.', options: ['not', 'am', 'are', 'be'], correct: 'not', hint: 'الجو ليس بارداً' },
            { q: 'They ____ not old.', options: ['am', 'is', 'are', 'be'], correct: 'are', hint: 'هم ليسوا كباراً في السن' },
            { q: 'She is ____ crying.', options: ['not', 'no', 'are', 'am'], correct: 'not', hint: 'هي لا تبكي' },
            
            // Verb to Be - Questions
            { q: '____ you ready?', options: ['Am', 'Is', 'Are', 'Be'], correct: 'Are', hint: 'هل أنت مستعد؟' },
            { q: '____ it a dog?', options: ['Am', 'Is', 'Are', 'Was'], correct: 'Is', hint: 'هل هذا كلب؟' },
            { q: '____ I late?', options: ['Am', 'Is', 'Are', 'Been'], correct: 'Am', hint: 'هل أنا متأخر؟' },
            { q: '____ they happy?', options: ['Am', 'Is', 'Are', 'Be'], correct: 'Are', hint: 'هل هم سعداء؟' },
            { q: '____ Sarah tall?', options: ['Am', 'Is', 'Are', 'Be'], correct: 'Is', hint: 'هل سارة طويلة؟' },
            
            // Mixed / Names
            { q: 'The cars ____ fast.', options: ['am', 'is', 'are', 'be'], correct: 'are', hint: 'السيارات سريعة' },
            { q: 'Ali ____ strong.', options: ['am', 'is', 'are', 'be'], correct: 'is', hint: 'علي قوي' },
            { q: 'You and I ____ friends.', options: ['am', 'is', 'are', 'be'], correct: 'are', hint: 'أنا وأنت أصدقاء' },
            { q: 'The flowers ____ pretty.', options: ['am', 'is', 'are', 'be'], correct: 'are', hint: 'الأزهار جميلة' },
            { q: 'The book ____ on the desk.', options: ['am', 'is', 'are', 'be'], correct: 'is', hint: 'الكتاب على المكتب' }
        ];

        let questions = []; // سيتم اختيار عينة عشوائية منها
        let currentIdx = 0;
        let score = 0;
        let correctAnswers = 0;
        let timerSeconds = 0;
        let timerInterval;
        let playerImage = "";

        // Handle Image Upload Preview
        document.getElementById('child-picture').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    playerImage = event.target.result;
                    document.getElementById('image-preview').src = playerImage;
                };
                reader.readAsDataURL(file);
            }
        });

        function startGame() {
            const nameInput = document.getElementById('child-name');
            const name = nameInput.value.trim();
            if (!name) {
                alert("من فضلك اكتب اسمك أولاً!");
                return;
            }

            // اختيار 12 سؤال عشوائي من بنك الأسئلة في كل مرة
            questions = [...questionBank].sort(() => Math.random() - 0.5).slice(0, 12);

            document.getElementById('player-display-name').textContent = name;
            if (playerImage) {
                document.getElementById('player-pic-small').src = playerImage;
                document.getElementById('player-pic-small').classList.remove('hidden');
                document.getElementById('player-pic-final').src = playerImage;
                document.getElementById('player-pic-final').classList.remove('hidden');
            }

            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            startTimer();
            loadQuestion();
            speakChildMode(`Hello ${name}! Let's start our English adventure!`);
        }

        function startTimer() {
            timerSeconds = 0;
            timerInterval = setInterval(() => {
                timerSeconds++;
                const mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
                const secs = String(timerSeconds % 60).padStart(2, '0');
                document.getElementById('timer').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function loadQuestion() {
            const q = questions[currentIdx];
            document.getElementById('progress-bar').style.width = `${(currentIdx / questions.length) * 100}%`;

            const qBox = document.getElementById('question-box');
            qBox.className = "card p-8 min-h-[300px] flex flex-col items-center justify-center text-center relative overflow-hidden border-4 border-transparent transition-all";
            
            qBox.innerHTML = `
                <span class="absolute top-4 right-4 bg-indigo-100 text-indigo-600 px-3 py-1 rounded-full text-xs font-bold">Q ${currentIdx + 1}/${questions.length}</span>
                <div class="en-font text-4xl font-bold mb-6 text-gray-800 leading-relaxed">
                    ${q.q.replace('____', '<span class="text-indigo-500 border-b-4 border-dashed border-indigo-200 px-4">?</span>')}
                </div>
                <p class="text-xl text-gray-500 mb-6">${q.hint}</p>
                <button onclick="speakChildMode('${q.q.replace('____', q.correct)}')" class="bg-indigo-50 text-indigo-600 p-4 rounded-full hover:bg-indigo-100 transition-transform active:scale-90">
                    <i class="fas fa-volume-up text-2xl"></i>
                </button>
            `;

            const grid = document.getElementById('options-grid');
            grid.innerHTML = '';
            
            [...q.options].sort(() => Math.random() - 0.5).forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "en-font bg-white border-2 border-gray-100 hover:border-indigo-400 p-6 rounded-2xl text-2xl font-bold shadow-sm transition-all active:scale-95 text-gray-700";
                btn.textContent = opt;
                btn.onclick = () => checkAnswer(opt, btn);
                grid.appendChild(btn);
            });
        }

        function checkAnswer(answer, btn) {
            const q = questions[currentIdx];
            const isCorrect = answer === q.correct;
            const qBox = document.getElementById('question-box');

            Array.from(document.getElementById('options-grid').children).forEach(b => b.disabled = true);

            if (isCorrect) {
                btn.classList.replace('bg-white', 'bg-green-500');
                btn.classList.add('text-white', 'border-green-500');
                qBox.classList.add('border-green-400', 'bg-green-50');
                score += 10;
                correctAnswers++;
                document.getElementById('score').textContent = score;
                speakChildMode("True! Great job!");
            } else {
                btn.classList.replace('bg-white', 'bg-red-500');
                btn.classList.add('text-white', 'border-red-500');
                qBox.classList.add('border-red-400', 'bg-red-50');
                speakChildMode("False! Try again.");
                
                Array.from(document.getElementById('options-grid').children).forEach(b => {
                    if (b.textContent === q.correct) b.classList.add('border-green-500', 'text-green-600', 'bg-green-50');
                });
            }

            setTimeout(() => {
                currentIdx++;
                if (currentIdx < questions.length) loadQuestion();
                else endGame();
            }, 1800);
        }

        function endGame() {
            clearInterval(timerInterval);
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('results-screen').classList.remove('hidden');
            
            const accuracy = Math.round((correctAnswers / questions.length) * 100);
            document.getElementById('final-stats').innerHTML = `
                النقاط الكلية: <span class="text-indigo-600 font-bold">${score}</span><br>
                الوقت المستغرق: <span class="text-indigo-600 font-bold">${document.getElementById('timer').textContent}</span>
            `;
            document.getElementById('accuracy-text').textContent = `الدقة: ${accuracy}%`;
            
            speakChildMode(`Congratulations! You finished with ${score} points!`);
        }

        function speakChildMode(text) {
            const synth = window.speechSynthesis;
            if (synth.speaking) synth.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.pitch = 1.6;
            utterance.rate = 0.95;
            synth.speak(utterance);
        }
    </script>
</body>
</html>
