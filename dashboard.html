<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم والإحصائيات - الإدارة</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <style>
    :root {
      --primary: #2563eb;
      --secondary: #0f172a;
      --bg-light: #f8fafc;
      --surface: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --success: #10b981;
      --warning: #f59e0b;
      --warning-bg: #fffbeeb;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
    body { background-color: var(--bg-light); color: var(--text-main); padding: 1.5rem; }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      background: var(--surface);
      padding: 1rem 1.5rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
    }
    header h1 { font-size: 1.3rem; color: var(--secondary); }

    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .kpi-icon {
      width: 50px; height: 50px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .kpi-icon.blue { background: #dbeafe; color: var(--primary); }
    .kpi-icon.green { background: #d1fae5; color: var(--success); }
    .kpi-icon.red { background: #fee2e2; color: var(--danger); }
    .kpi-icon.amber { background: #fef3c7; color: var(--warning); }
    .kpi-info h3 { font-size: 0.85rem; color: var(--text-muted); }
    .kpi-info p { font-size: 1.5rem; font-weight: 800; color: var(--secondary); }

    .alerts-container { margin-bottom: 1.5rem; }
    .alert-item {
      padding: 1rem;
      border-radius: var(--radius);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .alert-item.warning { background: var(--warning-bg); border: 1px solid #fde68a; color: #92400e; }
    .alert-item.danger { background: var(--danger-bg); border: 1px solid #fecaca; color: #991b1b; }

    .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }
    .card-title { font-size: 1.1rem; font-weight: 700; color: var(--secondary); margin-bottom: 1.2rem; }
    .chart-container { position: relative; height: 260px; width: 100%; }

    .table-wrapper { overflow-x: auto; border-radius: var(--radius); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; text-align: right; background: var(--surface); font-size: 0.9rem; }
    th { background: #f8fafc; padding: 0.85rem; border-bottom: 1px solid var(--border); color: var(--text-muted); font-weight: 700; }
    td { padding: 0.85rem; border-bottom: 1px solid var(--border); }
    
    tr.low-titer { background-color: var(--danger-bg) !important; }
    tr.low-titer td { color: #991b1b; font-weight: 600; }
    
    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-danger { background: #fee2e2; color: #991b1b; }
    .badge-success { background: #d1fae5; color: #065f46; }

    .btn-refresh {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
  </style>
</head>
<body>

  <header>
    <h1><i class="fa-solid fa-chart-line" style="color: var(--primary);"></i> لوحة متابعة الفحوصات الطبية</h1>
    <button class="btn-refresh" onclick="loadDashboardData()">
      <i class="fa-solid fa-rotate" id="refreshIcon"></i> تحديث البيانات
    </button>
  </header>

  <div class="kpi-grid">
    <div class="kpi-card">
      <div class="kpi-icon blue"><i class="fa-solid fa-users"></i></div>
      <div class="kpi-info">
        <h3>إجمالي المسجلين</h3>
        <p id="kpiTotal">0</p>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon green"><i class="fa-solid fa-shield-virus"></i></div>
      <div class="kpi-info">
        <h3>عدد المحصنين</h3>
        <p id="kpiVaccinated">0</p>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon red"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <div class="kpi-info">
        <h3>غير المحصنين (Titer < 15)</h3>
        <p id="kpiNonVaccinated">0</p>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon amber"><i class="fa-solid fa-percent"></i></div>
      <div class="kpi-info">
        <h3>نسبة التغطية</h3>
        <p id="kpiCoverage">0%</p>
      </div>
    </div>
  </div>

  <div id="alertsContainer" class="alerts-container"></div>

  <div class="charts-grid">
    <div class="card">
      <h3 class="card-title"><i class="fa-solid fa-chart-pie"></i> حالة التحصين العامة</h3>
      <div class="chart-container"><canvas id="immunityChart"></canvas></div>
    </div>
    <div class="card">
      <h3 class="card-title"><i class="fa-solid fa-chart-column"></i> التوزيع حسب الأقسام</h3>
      <div class="chart-container"><canvas id="deptChart"></canvas></div>
    </div>
  </div>

  <div class="card">
    <h3 class="card-title"><i class="fa-solid fa-table-list"></i> سجل البيانات المدخلة الكامل</h3>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>اسم الموظف</th>
            <th>الرقم الوطني</th>
            <th>الوظيفة</th>
            <th>المركز / القسم</th>
            <th>تاريخ الفحص</th>
            <th>نتيجة Titer</th>
            <th>المطعوم</th>
            <th>إعادة الفحص</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="recordsTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1mF-j0oz4XzGUPQ12qOCi253UISVTvXUV3sqnS5-2uTSOsVeISVNlITfYTkblpRr49A/exec";

    let recordsData = [];
    let immunityChartObj = null;
    let deptChartObj = null;

    window.onload = () => {
      loadDashboardData();
    };

    async function loadDashboardData() {
      const icon = document.getElementById('refreshIcon');
      icon.classList.add('fa-spin');

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "GET_RECORDS" })
        });
        const response = await res.json();

        if (response.status === "success" && Array.isArray(response.data)) {
          recordsData = response.data;
          renderDashboard();
        }
      } catch (err) {
        console.error("Error fetching data:", err);
      } finally {
        icon.classList.remove('fa-spin');
      }
    }

    function renderDashboard() {
      renderTableAndAlerts();
      calculateKPIs();
      renderCharts();
    }

    function renderTableAndAlerts() {
      const tbody = document.getElementById('recordsTableBody');
      const alertsDiv = document.getElementById('alertsContainer');
      tbody.innerHTML = '';
      alertsDiv.innerHTML = '';

      const today = new Date();
      let alertHTML = '';

      recordsData.forEach(row => {
        const isLowTiter = row.titerResult < 15;
        const retestDateObj = new Date(row.retestDate);
        const daysToRetest = Math.ceil((retestDateObj - today) / (1000 * 60 * 60 * 24));

        const trClass = isLowTiter ? 'low-titer' : '';
        const badge = isLowTiter 
          ? `<span class="badge badge-danger"><i class="fa-solid fa-xmark"></i> غير محصن</span>`
          : `<span class="badge badge-success"><i class="fa-solid fa-check"></i> محصن</span>`;

        if (daysToRetest >= 0 && daysToRetest <= 14) {
          alertHTML += `
            <div class="alert-item warning">
              <i class="fa-solid fa-clock"></i>
              تنبيه: اقتراب موعد إعادة الفحص للموظف <strong>${row.employeeName}</strong> (${row.department}) بتاريخ <strong>${row.retestDate}</strong>.
            </div>`;
        }

        if (isLowTiter && row.needsVaccine === "نعم") {
          alertHTML += `
            <div class="alert-item danger">
              <i class="fa-solid fa-syringe"></i>
              تنبيه هام: الموظف <strong>${row.employeeName}</strong> النتيجة أقل من 15 (Titer: ${row.titerResult}) ويحتاج أخذ المطعوم فوراً.
            </div>`;
        }

        tbody.innerHTML += `
          <tr class="${trClass}">
            <td><strong>${row.employeeName}</strong></td>
            <td>${row.nationalId}</td>
            <td>${row.jobTitle}</td>
            <td>${row.centerName} / ${row.department}</td>
            <td>${row.testDate}</td>
            <td><strong>${row.titerResult}</strong> IU/mL</td>
            <td>${row.needsVaccine}</td>
            <td>${row.retestDate}</td>
            <td>${badge}</td>
          </tr>`;
      });

      alertsDiv.innerHTML = alertHTML;
    }

    function calculateKPIs() {
      const total = recordsData.length;
      const nonVaccinated = recordsData.filter(r => r.titerResult < 15).length;
      const vaccinated = total - nonVaccinated;
      const coverageRate = total > 0 ? ((vaccinated / total) * 100).toFixed(1) : 0;

      document.getElementById('kpiTotal').innerText = total;
      document.getElementById('kpiVaccinated').innerText = vaccinated;
      document.getElementById('kpiNonVaccinated').innerText = nonVaccinated;
      document.getElementById('kpiCoverage').innerText = coverageRate + '%';
    }

    function renderCharts() {
      const total = recordsData.length;
      const nonVaccinated = recordsData.filter(r => r.titerResult < 15).length;
      const vaccinated = total - nonVaccinated;

      const ctx1 = document.getElementById('immunityChart').getContext('2d');
      if (immunityChartObj) immunityChartObj.destroy();
      immunityChartObj = new Chart(ctx1, {
        type: 'doughnut',
        data: {
          labels: ['محصن (≥15)', 'غير محصن (<15)'],
          datasets: [{
            data: [vaccinated, nonVaccinated],
            backgroundColor: ['#10b981', '#ef4444']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      const deptCounts = {};
      recordsData.forEach(r => {
        if(r.department) deptCounts[r.department] = (deptCounts[r.department] || 0) + 1;
      });

      const ctx2 = document.getElementById('deptChart').getContext('2d');
      if (deptChartObj) deptChartObj.destroy();
      deptChartObj = new Chart(ctx2, {
        type: 'bar',
        data: {
          labels: Object.keys(deptCounts),
          datasets: [{
            label: 'عدد الفحوصات',
            data: Object.values(deptCounts),
            backgroundColor: '#2563eb'
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }
  </script>
</body>
</html>
